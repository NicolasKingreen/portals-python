[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "portals-api"
version = "0.1.0"
description = "A typed Python client for the Portals Partners API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Portals API client contributors" }]
keywords = ["portals", "telegram", "ton", "nft", "api", "asyncio"]
dependencies = [
    "httpx2>=2.16,<3",
    "pydantic>=2.8,<3",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/NicolasKingreen/portals-python"
Source = "https://github.com/NicolasKingreen/portals-python"
Issues = "https://github.com/NicolasKingreen/portals-python/issues"
Changelog = "https://github.com/NicolasKingreen/portals-python/blob/main/CHANGELOG.md"
"API documentation" = "https://docs.portals.tg/developers/api/"

[dependency-groups]
dev = [
    "mypy>=1.8",
    "ruff>=0.8",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
portals = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/portals/models.py" = ["RUF022"]
