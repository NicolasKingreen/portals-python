name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov=portals
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="$(uv run python -c 'from importlib.metadata import version; print(version("portals-api"))')"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          if [ "${TAG_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "error: tag '${TAG_NAME}' does not match package version '${PACKAGE_VERSION}' (expected '${EXPECTED_TAG}')" >&2
            exit 1
          fi
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/portals-api
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.13
      - name: Smoke-install from TestPyPI
        run: |
          PACKAGE_VERSION="$(python3 -c 'import glob, os; whl = glob.glob("dist/*.whl")[0]; print(os.path.basename(whl).split("-")[1])')"
          uv venv /tmp/testpypi-smoke --python 3.13
          uv pip install \
            --python /tmp/testpypi-smoke/bin/python \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            "portals-api==${PACKAGE_VERSION}"
          /tmp/testpypi-smoke/bin/python -c "import httpx2, portals; assert portals.__version__ == '${PACKAGE_VERSION}'"

  publish-pypi:
    needs:
      - build
      - publish-testpypi
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/portals-api
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
