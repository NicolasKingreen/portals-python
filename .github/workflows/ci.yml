name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Check generated models are up to date
        run: |
          uv run python scripts/generate_models.py
          uv run ruff check --fix src/portals/models.py src/portals/_contract.py
          uv run ruff format src/portals/models.py src/portals/_contract.py
          git diff --exit-code

  test:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --locked --python ${{ matrix.python-version }}
      - run: uv run --python ${{ matrix.python-version }} pytest --cov=portals
      - run: uv build
      - name: Smoke-test built wheel in clean environment
        run: |
          uv venv /tmp/wheel-smoke --python ${{ matrix.python-version }}
          uv pip install --python /tmp/wheel-smoke/bin/python dist/*.whl
          /tmp/wheel-smoke/bin/python -c "from importlib.metadata import version; import httpx2, portals; assert portals.__version__ == version('portals-api'); assert portals.__api_version__ == '1.0.0'"
